services:
  web:
    build: .
    container_name: simpleblog-web

    ports:
      - "8080:80"

    volumes:
      - ./src:/var/www/html:Z

    depends_on:
      - db

  db:
    image: mariadb:11

    container_name: simpleblog-db

    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: simple_blog
      MARIADB_USER: bloguser
      MARIADB_PASSWORD: blogpass

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:Z

  phpmyadmin:
    image: phpmyadmin:latest

    container_name: simpleblog-pma

    depends_on:
      - db

    ports:
      - "8081:80"

    environment:
      PMA_HOST: db

volumes:
  db_data:
